<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>VALOUR Admin Dashboard</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#2d1814;background:#f5efe7;--red:#8f1e1e;--cream:#fffaf3;--line:#dfd0c2;--muted:#7a6760;--green:#267044}
    *{box-sizing:border-box}body{margin:0}.shell{width:min(1440px,calc(100% - 28px));margin:0 auto;padding:24px 0 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.12em;color:var(--red)}
    h1{margin:5px 0 0;font-family:Georgia,serif;font-size:clamp(30px,4vw,48px)}h2,h3{margin-top:0}.muted{color:var(--muted)}
    button,input,select{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--red);color:white;font-weight:800}.btn.secondary{background:#6e5448}.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--line)}
    .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.metric,.panel,.order-card{background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #54321c0b}.metric{padding:18px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:8px;font-size:25px}
    .tabs{display:flex;gap:8px;margin-bottom:16px}.tab.is-active{background:var(--red);color:white}.panel{padding:20px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 190px 190px auto;gap:10px;margin-bottom:18px}
    input,select{width:100%;border:1px solid #cdbdb0;border-radius:9px;background:white;padding:11px;color:inherit}.orders{display:grid;gap:12px}.order-card{padding:18px}
    .order-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.order-number{font-size:18px;font-weight:900;color:var(--red)}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:5px 9px;border-radius:999px;background:#eee3d8;font-size:11px;font-weight:800}.badge.paid{background:#dcefe2;color:#1c6338}.badge.cod{background:#fff0c9;color:#785600}
    .order-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.value{font-weight:700;overflow-wrap:anywhere}.items{margin:14px 0;padding:12px;background:#f6ede3;border-radius:10px}.items p{margin:5px 0}
    details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:800;color:var(--red)}.status-form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.status-form .wide{grid-column:span 2}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}
    .coupon-layout{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.assignment{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
    .empty{padding:32px;text-align:center;color:var(--muted)}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.notice{min-height:22px;margin:12px 0 0}.success{color:var(--green)}.error{color:var(--red)}
    .login{position:fixed;inset:0;display:grid;place-items:center;background:#8f1e1ef2;padding:20px;z-index:10}.login[hidden]{display:none}.login-card{width:min(440px,100%);background:var(--cream);padding:30px;border-radius:20px}.login-card input{margin:12px 0}.login-card .btn{width:100%}
    [hidden]{display:none!important}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.order-grid{grid-template-columns:repeat(2,1fr)}.coupon-layout{grid-template-columns:1fr}}
    @media(max-width:620px){.shell{width:min(100% - 18px,1440px);padding-top:14px}header{align-items:flex-start}.metrics,.toolbar,.order-grid,.status-form,.form-grid{grid-template-columns:1fr}.status-form .wide,.field.full{grid-column:auto}.order-head{display:block}.badges{justify-content:flex-start;margin-top:10px}.assignment{grid-template-columns:1fr 1fr}.panel{padding:14px}}
  </style>
</head>
<body>
  <div class="login" id="login">
    <form class="login-card" id="login-form"><p class="brand">VALOUR ADMIN</p><h2>Dashboard access</h2><p class="muted">Enter the private ORDER_ADMIN_TOKEN.</p><input id="admin-token" type="password" autocomplete="current-password" required><button class="btn">Open dashboard</button><p class="notice error" id="login-message"></p></form>
  </div>
  <div class="shell">
    <header><div><p class="brand">VALOUR ADMIN</p><h1>Operations dashboard</h1></div><div><button class="btn ghost" id="refresh">Refresh</button> <button class="btn ghost" id="logout">Log out</button></div></header>
    <section class="metrics" id="metrics"></section>
    <nav class="tabs"><button class="btn tab is-active" data-tab="orders">Orders</button><button class="btn ghost tab" data-tab="coupons">Customer coupons</button></nav>
    <section class="panel" id="orders-panel">
      <form class="toolbar" id="filters"><input id="search" placeholder="Order, customer, phone, tracking…"><select id="shipping-filter"><option value="">All shipping statuses</option><option>Order confirmed</option><option>Processing</option><option>Packed</option><option>Dispatched</option><option>Out for delivery</option><option>Delivered</option><option>Cancelled</option></select><select id="payment-filter"><option value="">All payment statuses</option><option value="paid">Paid</option><option value="pending_cod">Pending COD</option><option value="pending">Pending payment</option><option value="failed">Failed</option></select><button class="btn">Apply</button></form>
      <div class="orders" id="orders"><p class="empty">Enter the admin token to load orders.</p></div>
      <div class="pagination"><button class="btn ghost" id="previous">Previous</button><span id="page-label">Page 1</span><button class="btn ghost" id="next">Next</button></div>
    </section>
    <section class="panel" id="coupons-panel" hidden>
      <div class="coupon-layout">
        <div><h2>Assign customer coupon</h2><form id="coupon-form" class="form-grid"><div class="field full"><label for="coupon-phone">Customer phone</label><input id="coupon-phone" inputmode="numeric" placeholder="9876543210" required></div><div class="field full"><label for="coupon-code">Coupon</label><select id="coupon-code" required></select></div><div class="field"><label for="coupon-start">Starts at (optional)</label><input id="coupon-start" type="datetime-local"></div><div class="field"><label for="coupon-end">Ends at</label><input id="coupon-end" type="datetime-local" required></div><div class="field"><label for="coupon-limit">Usage limit</label><input id="coupon-limit" type="number" min="1" max="100" value="1" required></div><div class="field full"><button class="btn" type="submit">Assign coupon</button><p class="notice" id="coupon-message"></p></div></form></div>
        <div><h2>Recent assignments</h2><div id="assignments"></div></div>
      </div>
    </section>
  </div>
  <script>
    const TOKEN_KEY="valour_admin_token";let token=sessionStorage.getItem(TOKEN_KEY)||"";let dashboard=null;let currentPage=1;
    const $=(selector)=>document.querySelector(selector);
    const escapeHtml=(value)=>String(value??"").replace(/[&<>'"]/g,(character)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[character]);
    const money=(value)=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(Number(value)||0);
    const dateTime=(value)=>value?new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Kolkata"}).format(new Date(value)):"—";
    const dateInputValue=(value)=>{if(!value)return "";const match=String(value).match(/^\d{4}-\d{2}-\d{2}/);if(match)return match[0];const date=new Date(value);if(Number.isNaN(date.getTime()))return "";const parts=Object.fromEntries(new Intl.DateTimeFormat("en",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Asia/Kolkata"}).formatToParts(date).filter(part=>part.type!=="literal").map(part=>[part.type,part.value]));return `${parts.year}-${parts.month}-${parts.day}`};
    async function api(url,options={}){const response=await fetch(url,{...options,headers:{"Content-Type":"application/json","x-admin-token":token,...options.headers}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
    function renderMetrics(metrics){const rows=[["Total orders",metrics.totalOrders],["Orders today",metrics.todayOrders],["Pending fulfilment",metrics.pendingOrders],["Delivered",metrics.deliveredOrders],["Paid revenue",money(metrics.paidRevenue)]];$("#metrics").innerHTML=rows.map(([label,value])=>`<article class="metric"><span>${label}</span><strong>${value}</strong></article>`).join("")}
    const statusOptions=["Order confirmed","Processing","Packed","Dispatched","Out for delivery","Delivered","Cancelled"];
    function orderCard(order){const items=order.products.map(item=>`<p>${escapeHtml(item.name)}${item.size?` · ${escapeHtml(item.size)}`:""} · Qty ${item.quantity}${item.lineTotal!=null?` · ${money(item.lineTotal)}`:""}</p>`).join("")||"<p>No products recorded</p>";const options=statusOptions.map(status=>`<option ${status.toLowerCase()===String(order.shippingStatus).toLowerCase()?"selected":""}>${status}</option>`).join("");return `<article class="order-card"><div class="order-head"><div><div class="order-number">${escapeHtml(order.orderNumber)}</div><div class="muted">${dateTime(order.createdAt)}</div></div><div class="badges"><span class="badge ${order.paymentStatus==="paid"?"paid":"cod"}">${escapeHtml(order.paymentStatus||"Unknown payment")}</span><span class="badge">${escapeHtml(order.shippingStatus)}</span></div></div><div class="order-grid"><div><span class="label">Customer</span><span class="value">${escapeHtml(order.customerName)}</span></div><div><span class="label">Phone</span><span class="value">${escapeHtml(order.phone)}</span></div><div><span class="label">Payment</span><span class="value">${escapeHtml(order.paymentMethod)} · ${money(order.totalAmount)}</span></div><div><span class="label">Delivery address</span><span class="value">${escapeHtml([order.address,order.city,order.state,order.pincode].filter(Boolean).join(", "))}</span></div></div><div class="items">${items}</div><details><summary>Update fulfilment</summary><form class="status-form" data-order-form="${escapeHtml(order.id)}"><div><span class="label">Shipping status</span><select name="shippingStatus">${options}</select></div><div><span class="label">Courier / delivery person</span><input name="courierName" value="${escapeHtml(order.courierName)}"></div><div><span class="label">Tracking number</span><input name="trackingNumber" value="${escapeHtml(order.trackingNumber)}"></div><div class="wide"><span class="label">Tracking URL</span><input name="trackingUrl" value="${escapeHtml(order.trackingUrl)}"></div><div><span class="label">Expected delivery date</span><input type="date" name="expectedDeliveryDate" value="${escapeHtml(dateInputValue(order.expectedDeliveryDate))}"></div><label class="check"><input type="checkbox" name="notifyWhatsapp" checked> Send WhatsApp update</label><div><button class="btn" type="submit">Save status</button></div><p class="notice wide" data-status-message></p></form></details></article>`}
    function renderOrders(){const container=$("#orders");container.innerHTML=dashboard.orders.length?dashboard.orders.map(orderCard).join(""):"<p class='empty'>No matching orders.</p>";container.querySelectorAll("[data-order-form]").forEach(form=>form.addEventListener("submit",updateOrder));const p=dashboard.pagination;$("#page-label").textContent=`Page ${p.page} of ${p.pages} · ${p.total} orders`;$("#previous").disabled=p.page<=1;$("#next").disabled=p.page>=p.pages}
    function renderCoupons(){const select=$("#coupon-code");select.innerHTML=dashboard.couponDefinitions.filter(item=>item.active).map(item=>`<option value="${escapeHtml(item.code)}">${escapeHtml(item.code)} — ${item.type==="percent"?`${item.value}% off`:`${money(item.value)} off`}</option>`).join("");$("#assignments").innerHTML=dashboard.assignments.length?dashboard.assignments.map(item=>`<div class="assignment"><strong>${escapeHtml(item.code)}</strong><span>${escapeHtml(item.phone)}</span><span>${item.usedCount}/${item.usageLimit} used</span><span>Ends ${dateTime(item.endsAt)}</span></div>`).join(""):"<p class='empty'>No active assignments.</p>"}
    async function loadDashboard(){const params=new URLSearchParams({page:currentPage,limit:50});if($("#search").value.trim())params.set("search",$("#search").value.trim());if($("#shipping-filter").value)params.set("shippingStatus",$("#shipping-filter").value);if($("#payment-filter").value)params.set("paymentStatus",$("#payment-filter").value);dashboard=await api(`/api/admin/dashboard?${params}`);renderMetrics(dashboard.metrics);renderOrders();renderCoupons();$("#login").hidden=true}
    async function updateOrder(event){event.preventDefault();const form=event.currentTarget;const message=form.querySelector("[data-status-message]");const values=Object.fromEntries(new FormData(form));const payload={shippingStatus:values.shippingStatus,courierName:values.courierName,trackingNumber:values.trackingNumber,trackingUrl:values.trackingUrl,expectedDeliveryDate:values.expectedDeliveryDate,notifyWhatsapp:form.elements.notifyWhatsapp.checked};message.className="notice";message.textContent="Saving…";try{await api(`/api/orders/${encodeURIComponent(form.dataset.orderForm)}/shipping-status`,{method:"POST",body:JSON.stringify(payload)});message.className="notice success";message.textContent="Order updated and WhatsApp workflow processed.";await loadDashboard()}catch(error){message.className="notice error";message.textContent=error.message}}
    $("#login-form").addEventListener("submit",async event=>{event.preventDefault();token=$("#admin-token").value.trim();try{await loadDashboard();sessionStorage.setItem(TOKEN_KEY,token);$("#login-message").textContent=""}catch(error){token="";$("#login-message").textContent=error.message}});
    $("#filters").addEventListener("submit",event=>{event.preventDefault();currentPage=1;loadDashboard().catch(showLoadError)});$("#refresh").addEventListener("click",()=>loadDashboard().catch(showLoadError));$("#previous").addEventListener("click",()=>{currentPage--;loadDashboard().catch(showLoadError)});$("#next").addEventListener("click",()=>{currentPage++;loadDashboard().catch(showLoadError)});
    $("#logout").addEventListener("click",()=>{sessionStorage.removeItem(TOKEN_KEY);token="";$("#admin-token").value="";$("#login").hidden=false});
    document.querySelectorAll("[data-tab]").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(item=>{item.classList.toggle("is-active",item===button);item.classList.toggle("ghost",item!==button)});$("#orders-panel").hidden=button.dataset.tab!=="orders";$("#coupons-panel").hidden=button.dataset.tab!=="coupons"}));
    $("#coupon-form").addEventListener("submit",async event=>{event.preventDefault();const message=$("#coupon-message");const starts=$("#coupon-start").value;const ends=$("#coupon-end").value;const payload={phone:$("#coupon-phone").value,code:$("#coupon-code").value,usageLimit:Number($("#coupon-limit").value),startsAt:starts?new Date(starts).toISOString():null,endsAt:new Date(ends).toISOString()};message.className="notice";message.textContent="Assigning…";try{const data=await api("/api/admin/coupons/assign",{method:"POST",body:JSON.stringify(payload)});message.className="notice success";message.textContent=`${data.assignment.code} assigned to ${data.assignment.phone}.`;await loadDashboard()}catch(error){message.className="notice error";message.textContent=error.message}});
    function showLoadError(error){if(/unauthorized/i.test(error.message)){sessionStorage.removeItem(TOKEN_KEY);token="";$("#login").hidden=false;$("#login-message").textContent="Admin token expired or is invalid."}else{$("#orders").innerHTML=`<p class='empty error'>${escapeHtml(error.message)}</p>`}}
    if(token){loadDashboard().catch(showLoadError)}
  </script>
</body>
</html>

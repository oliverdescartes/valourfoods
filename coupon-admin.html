<!doctype html>
<html lang="en-IN">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YRQF7PS079"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YRQF7PS079');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Coupon assignment | Valour Admin</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #241b17; background: #f7f3ed; }
    body { margin: 0; padding: 40px 20px; }
    main { max-width: 560px; margin: auto; background: white; padding: 32px; border-radius: 18px; box-shadow: 0 12px 40px #3b24151a; }
    h1 { margin-top: 0; } label { display: block; margin: 18px 0 7px; font-weight: 700; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 13px; border: 1px solid #cabdb2; border-radius: 9px; font: inherit; }
    button { margin-top: 24px; color: white; background: #762f1f; border: 0; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; } #message { min-height: 24px; margin-bottom: 0; } .error { color: #a51e1e; } .success { color: #26703c; }
  </style>
</head>
<body>
  <main>
    <p><a href="/admin">Open the full operations dashboard →</a></p>
    <p>Valour administration</p>
    <h1>Assign a coupon</h1>
    <form id="assignment-form">
      <label for="token">Admin token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <label for="phone">Customer phone</label>
      <input id="phone" type="tel" inputmode="numeric" placeholder="9876543210" required>
      <label for="code">Coupon</label>
      <select id="code" required>
        <option value="WELCOME10">WELCOME10 — 10% off</option>
        <option value="FIRSTORDER">FIRSTORDER — Rs. 75 off above Rs. 499</option>
        <option value="VALOURVIP">VALOURVIP — 15% off above Rs. 799</option>
      </select>
      <button type="submit">Assign coupon</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#assignment-form");
    const message = document.querySelector("#message");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      message.className = "";
      message.textContent = "Assigning…";
      try {
        const response = await fetch("/api/admin/coupons/assign", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-token": document.querySelector("#token").value },
          body: JSON.stringify({ phone: document.querySelector("#phone").value, code: document.querySelector("#code").value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Assignment failed");
        message.className = "success";
        message.textContent = `${data.assignment.code} is now available to ${data.assignment.phone}.`;
      } catch (error) {
        message.className = "error";
        message.textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>

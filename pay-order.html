  <title>Pay for your VALOUR order</title>
  <style>
    :root { color-scheme:light; --red:#831a1a; --cream:#fff8ef; --gold:#d5ad35; --ink:#35100f; --muted:#765f5c; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--red); color:var(--ink); font-family:Inter,Arial,sans-serif; }
    main { width:min(100%,620px); border-radius:24px; background:var(--cream); padding:clamp(28px,6vw,52px); box-shadow:0 24px 70px rgba(38,5,5,.3); }
    .brand { margin:0 0 30px; color:var(--red); font-size:13px; font-weight:800; letter-spacing:.14em; }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(34px,7vw,52px); line-height:1.05; font-weight:600; }
    .intro { margin:14px 0 26px; color:var(--muted); line-height:1.55; }
    .summary { padding:22px 0; border-top:1px solid rgba(131,26,26,.16); border-bottom:1px solid rgba(131,26,26,.16); }
    .row { display:flex; justify-content:space-between; gap:20px; margin:8px 0; }
    .row span { color:var(--muted); }
    ul { margin:18px 0 0; padding-left:20px; line-height:1.7; }
    .pay { display:block; margin-top:26px; padding:15px 20px; border-radius:10px; background:var(--gold); color:var(--ink); text-align:center; font-weight:900; text-decoration:none; }
    .pay[hidden] { display:none; }
    .security { margin:15px 0 0; color:var(--muted); font-size:12px; text-align:center; }
    .error { color:var(--red); font-weight:700; }
  </style>
</head>
<body>
  <main>
    <p class="brand">VALOUR LIQUID SPICE</p>
    <h1>Pay securely online</h1>
    <p class="intro" id="message">Verifying your private order link…</p>
    <section class="summary" id="summary" hidden>
      <div class="row"><span>Order</span><strong id="order-number"></strong></div>
      <div class="row"><span>Amount</span><strong id="amount"></strong></div>
      <ul id="items"></ul>
    </section>
    <a class="pay" id="pay-button" hidden rel="noopener noreferrer">Continue to Razorpay</a>
    <p class="security" id="security" hidden>You will complete payment on Razorpay’s secure payment page.</p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("t");
    const message = document.querySelector("#message");
    const apiBase = location.origin;
    async function loadPayment() {
      if (!token) throw new Error("This payment link is incomplete.");
      const response = await fetch(`${apiBase}/api/cod-payment/${encodeURIComponent(token)}`);
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "Unable to prepare this payment.");
      if (!/^https:\/\//i.test(data.redirectUrl || "")) throw new Error("The secure payment destination is unavailable.");
      const order = data.order;
      document.querySelector("#order-number").textContent = order.orderNumber;
      document.querySelector("#amount").textContent = new Intl.NumberFormat("en-IN", { style:"currency", currency:order.currency || "INR" }).format(order.amount || 0);
      const items = document.querySelector("#items");
      (order.items || []).forEach((item) => {
        const li = document.createElement("li");
        const size = item.size ? ` · ${item.size}` : "";
        li.textContent = `${item.name}${size} · Qty ${item.quantity}`;
        items.appendChild(li);
      });
      if (!order.items?.length) items.innerHTML = "<li>Order items will be confirmed by VALOUR.</li>";
      const payButton = document.querySelector("#pay-button");
      payButton.href = data.redirectUrl;
      payButton.hidden = false;
      document.querySelector("#summary").hidden = false;
      document.querySelector("#security").hidden = false;
      message.textContent = "Check your order details, then continue to payment.";
    }
    loadPayment().catch((error) => {
      message.textContent = error.message;
      message.classList.add("error");
    });
  </script>
</body>
</html>

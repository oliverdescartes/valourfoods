    <title>Track your VALOUR order</title>
    <style>
      :root {
        color-scheme: light;
        --red: #831a1a;
        --cream: #fff8ef;
        --gold: #d5ad35;
        --ink: #35100f;
        --muted: #765f5c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--red);
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
      }
      main {
        width: min(100%, 620px);
        border-radius: 24px;
        background: var(--cream);
        padding: clamp(28px, 6vw, 52px);
        box-shadow: 0 24px 70px rgba(38, 5, 5, 0.3);
      }
      .brand {
        margin: 0 0 32px;
        color: var(--red);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(34px, 7vw, 52px);
        line-height: 1;
        font-weight: 600;
      }
      .intro {
        margin: 14px 0 30px;
        color: var(--muted);
        line-height: 1.55;
      }
      .status {
        border-top: 1px solid rgba(131, 26, 26, 0.16);
        border-bottom: 1px solid rgba(131, 26, 26, 0.16);
        padding: 24px 0;
      }
      .label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .value {
        display: block;
        font-size: 19px;
        font-weight: 800;
      }
      dl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        margin: 28px 0 0;
      }
      dt {
        color: var(--muted);
        font-size: 12px;
      }
      dd {
        margin: 5px 0 0;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .items {
        margin-top: 28px;
      }
      .items ul {
        margin: 10px 0 0;
        padding-left: 20px;
        line-height: 1.7;
      }
      .error {
        color: var(--red);
      }
      @media (max-width: 480px) {
        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">VALOUR LIQUID SPICE</p>
      <h1>Track your order</h1>
      <p class="intro" id="message">Fetching the latest update…</p>
      <section id="details" hidden>
        <div class="status">
          <span class="label">Current status</span
          ><strong class="value" id="status"></strong>
        </div>
        <dl>
          <div>
            <dt>Order</dt>
            <dd id="order-number"></dd>
          </div>
          <div>
            <dt>Order total</dt>
            <dd id="order-total"></dd>
          </div>
          <div>
            <dt>Payment</dt>
            <dd id="payment"></dd>
          </div>
          <div>
            <dt>Expected delivery</dt>
            <dd id="eta"></dd>
          </div>
        </dl>
        <div class="items">
          <span class="label">Items</span>
          <ul id="items"></ul>
        </div>
      </section>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("t");
      const message = document.querySelector("#message");
      const setText = (selector, value, fallback = "Not available yet") => {
        document.querySelector(selector).textContent = value || fallback;
      };
      async function loadTracking() {
        if (!token) throw new Error("This tracking link is incomplete.");
        const apiBase = location.origin;
        const response = await fetch(
          `${apiBase}/api/order-tracking/${encodeURIComponent(token)}`,
        );
        const data = await response.json();
        if (!response.ok || !data.ok)
          throw new Error(data.error || "Unable to load this order.");
        const order = data.order;
        message.textContent =
          "Here is the latest update for your VALOUR order.";
        setText("#status", order.shippingStatus);
        setText("#order-number", order.orderNumber);
        setText(
          "#order-total",
          new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: order.currency || "INR",
          }).format(order.totalAmount || 0),
        );
        setText(
          "#payment",
          [order.paymentStatus, order.paymentMethod]
            .filter(Boolean)
            .join(" · "),
        );
        setText("#eta", order.expectedDelivery);
        const items = document.querySelector("#items");
        (order.items || []).forEach((item) => {
          const li = document.createElement("li");
          const size = item.size ? ` · ${item.size}` : "";
          const price = Number.isFinite(item.lineTotal)
            ? ` · ${new Intl.NumberFormat("en-IN", { style: "currency", currency: order.currency || "INR" }).format(item.lineTotal)}`
            : "";
          li.textContent = `${item.name}${size} · Qty ${item.quantity}${price}`;
          items.appendChild(li);
        });
        if (!order.items?.length)
          items.innerHTML = "<li>Order items unavailable</li>";
        document.querySelector("#details").hidden = false;
      }
      loadTracking().catch((error) => {
        message.textContent = error.message;
        message.classList.add("error");
      });
    </script>
  </body>
</html>
